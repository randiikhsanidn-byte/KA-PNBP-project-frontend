        .hero-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(10,49,97,.10) 0%, rgba(10,49,97,.26) 100%);
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        .soft-card {
            background: rgba(255,255,255,.96);
            border: 1px solid rgba(217,226,236,.9);
            box-shadow: 0 14px 32px rgba(10,49,97,.08);
        }

        .ask-shell {
            border: 1px solid #D9E2EC;
            background: #FFFFFF;
            border-radius: 18px;
            box-shadow: 0 10px 28px rgba(10,49,97,.06);
        }

        .ask-area {
            border: 1px solid #D9E2EC;
            background: #F7FAFC;
            border-radius: 16px;
            min-height: 290px;
        }

        .ask-bubble {
            border: 1px solid #D9E2EC;
            box-shadow: 0 6px 18px rgba(15,23,42,.05);
        }

        .modal-backdrop {
            background: rgba(15, 23, 42, .55);
            backdrop-filter: blur(6px);
        }

<body class="bg-bgLight text-slate-800 min-h-screen flex flex-col">
<div id="app" class="flex-1 flex flex-col"></div>

<script>
    let state = {
        isLoggedIn: false,
        role: null,
        loginOpen: false
    };

    const renderNav = () => `
        <nav class="flex justify-between items-center px-6 md:px-8 py-4 bg-navy text-white shadow-md border-b-4 border-yellow">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-yellow rounded flex items-center justify-center font-bold text-navy">P</div>
                <span class="font-bold text-xl tracking-wide">PNBP</span>
            </div>

            ${state.isLoggedIn
                ? `
                    <button onclick="logout()"
                        class="px-5 py-2 bg-red-500/20 text-red-100 hover:bg-red-500 hover:text-white font-semibold rounded-md text-sm border border-red-500/30 transition-colors">
                        Keluar Sistem
                    </button>
                `
                : `
                    <button onclick="openLogin()"
                        class="px-5 py-2 bg-yellow text-navy hover:bg-yellow/90 font-semibold rounded-md text-sm transition-colors shadow-sm">
                        Login
                    </button>
                `
            }
        </nav>
    `;

    const renderLanding = () => `
        ${renderNav()}

        <section class="hero-bg">
            <div class="hero-content max-w-6xl mx-auto px-6 py-14 md:py-16">
                <div class="max-w-2xl text-white">
                    <h1 class="text-3xl md:text-5xl font-extrabold leading-tight">
                        Informasi tarif PNBP
                    </h1>
                    <p class="mt-4 text-sm md:text-lg text-slate-100/95 max-w-xl leading-relaxed">
                        Akses informasi tarif, sampaikan masukan atas tarif PNBP, dan ajukan pertanyaan terkait layanan PNBP.
                    </p>
                </div>
            </div>
        </section>

        <main class="max-w-6xl mx-auto px-6 -mt-10 md:-mt-14 pb-10 w-full relative z-10">
            <div class="grid lg:grid-cols-2 gap-8">

                <!-- LEFT PANEL - redesigned following attached mockup -->
                <section class="ask-shell p-6 md:p-7">
                    <div class="flex items-center gap-4 pb-5 border-b border-slate-200">
                        <div class="w-14 h-14 rounded-xl bg-indigo-50 flex items-center justify-center text-2xl">
                            🤖
                        </div>
                        <h2 class="text-2xl md:text-[2rem] font-extrabold text-navy">
                            Asisten AI Tarif PNBP
                        </h2>
                    </div>

                    <div class="ask-area mt-5 p-5 md:p-6 flex flex-col justify-end">
                        <div class="flex items-end gap-4">
                            <div class="w-10 h-10 rounded-full bg-navy text-white flex items-center justify-center text-sm font-bold shrink-0">
                                AI
                            </div>
                            <div class="ask-bubble bg-white rounded-2xl rounded-bl-md px-4 py-4 md:px-5 md:py-4 max-w-[78%]">
                                <p class="text-slate-800 text-lg leading-relaxed">
                                    Halo! Saya ditenagai arsitektur RAG. Ada yang bisa saya bantu terkait tarif PNBP pada instansi tertentu?
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-5 flex gap-3">
                        <input id="question"
                            type="text"
                            placeholder="Ketik pertanyaan regulasi..."
                            class="flex-1 h-14 px-5 border border-lineSoft rounded-xl text-base bg-white focus:outline-none focus:ring-2 focus:ring-navy/40 focus:border-navy" />
                        <button onclick="answerQuestion()"
                            class="px-8 h-14 bg-navy hover:bg-blue-900 text-white rounded-xl text-base font-semibold transition-colors">
                            Kirim
                        </button>
                    </div>
                </section>

                <!-- RIGHT PANEL -->
                <section class="soft-card rounded-2xl p-6 md:p-7">
                    <div class="flex items-center gap-3 pb-5 border-b border-slate-200">
                        <div class="w-12 h-12 rounded-xl bg-green/10 flex items-center justify-center text-green text-xl">✎</div>
                        <div>
                            <h2 class="text-xl md:text-2xl font-bold text-navy">Masukan atas Tarif PNBP</h2>
                        </div>
                    </div>

                    <form class="space-y-5 mt-6" onsubmit="submitAspiration(event)">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">Kementerian / Lembaga</label>
                            <select class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white cursor-pointer focus:ring-2 focus:ring-navy/50">
                                <option value="">Pilih instansi...</option>
                                <option>Kementerian Perhubungan</option>
                                <option>Kementerian Kehutanan</option>
                                <option>Kementerian Pertanian</option>
                                <option>Kepolisian Negara RI</option>
                                <option>Kementerian ATR/BPN</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">Jenis Masukan</label>
                            <select class="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white cursor-pointer focus:ring-2 focus:ring-navy/50">
                                <option value="">Pilih kategori...</option>
                                <option>Evaluasi Tarif Berjalan</option>
                                <option>Usulan Tarif Baru</option>
                                <option>Kualitas Layanan</option>
                                <option>Lainnya</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1.5">Detail Masukan</label>
                            <textarea rows="7"
                                class="w-full p-3 border border-slate-300 rounded-xl text-sm resize-none focus:ring-2 focus:ring-navy/50"
                                placeholder="Tuliskan masukan Anda..."></textarea>
                        </div>

                        <button type="submit"
                            class="w-full bg-green text-white font-bold py-3.5 rounded-xl text-sm hover:bg-green/90 transition-colors shadow-sm">
                            Kirim Masukan
                        </button>
                    </form>
                </section>
            </div>
        </main>

        <footer class="border-t border-slate-200 bg-white mt-auto">
            <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between text-xs text-slate-400">
                <span>PNBP</span>
                <span>Prototype</span>
            </div>
        </footer>

        ${state.loginOpen ? renderLoginModal() : ''}
    `;

    const renderLoginModal = () => `
        <div class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4" onclick="closeLoginByBackdrop(event)">
            <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md p-6">
                <div class="flex items-start justify-between mb-5">
                    <div>
                        <h2 class="text-xl font-bold text-navy">Login PNBP</h2>
                        <p class="text-sm text-slate-500 mt-1">Pilih akses pengguna untuk prototype.</p>
                    </div>
                    <button onclick="closeLogin()"
                        class="w-8 h-8 flex items-center justify-center rounded-md bg-slate-100 text-slate-500 hover:bg-slate-200">
                        ×
                    </button>
                </div>
